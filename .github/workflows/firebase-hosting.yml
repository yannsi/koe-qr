# main に送られたら、自動で Firebase Hosting（プロジェクト koe-qr）に公開する
name: Firebaseに公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    # ubuntu-latest は 2026年10月19日から Ubuntu 26 に切り替わり始め、その後 Firebase への公開が失敗するようになった。
    # 公開の仕事は 24.04 に固定し、Firebase の道具（firebase-tools）が対応している Node 22 を明示して使う
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: koe-qr
