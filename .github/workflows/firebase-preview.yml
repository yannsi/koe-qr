# main 以外のブランチに送られたら、確認用アドレス（Firebaseのプレビューチャンネル）に公開する。
# 公開したアドレスは、そのコミットの「ステータス」に載せる（GitHubの画面でコミット横の印から開ける）。
name: 確認用に公開

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ch
        name: ブランチ名から確認用チャンネル名を作る
        run: echo "name=$(echo '${{ github.ref_name }}' | tr -c 'a-zA-Z0-9-' '-' | cut -c1-30 | sed 's/-*$//')" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: koe-qr
          channelId: ${{ steps.ch.outputs.name }}
          expires: 7d
      - name: 確認用アドレスをコミットに載せる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.details_url }}
        run: |
          echo "確認用アドレス: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"確認用アドレス\",\"description\":\"7日間有効\",\"target_url\":\"$URL\"}" > /dev/null
